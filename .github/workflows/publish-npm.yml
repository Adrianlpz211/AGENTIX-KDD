name: Publish npm (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json to publish
        required: true
        default: '3.20.2'
        type: string
permissions:
  contents: read
concurrency:
  group: agentic-kdd-npm-publish
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-syntax.cjs
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.node }}
          path: _output/release-*
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check requested version
        run: node -e "if(require('./package.json').version!==process.env.RELEASE_VERSION)process.exit(1)"
      - run: npm ci
      - run: npm run release:check
      - name: Publish the verified tarball
        run: node scripts/publish-verified.cjs
