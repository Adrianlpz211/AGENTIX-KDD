name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Syntax check & tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all .cjs modules
        run: node scripts/check-syntax.cjs

      - name: Run tests
        run: npm test

      - name: Check install scripts
        if: runner.os == 'Linux'
        run: bash -n install.sh && echo "✅ install.sh OK" || echo "⚠️ install.sh not found"
